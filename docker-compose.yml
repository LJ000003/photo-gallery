services:
  mysql:
    image: mysql:8.0
    container_name: photodb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-photodb}
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=134217728
      --performance-schema=OFF
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: pg-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - app-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pg-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - app-net

  prometheus:
    image: prom/prometheus:v3.2.0
    container_name: pg-prometheus
    restart: always
    environment:
      # 注入 prometheus.yml basic_auth 引用的抓取凭据（与 app 服务的 MONITORING_* 一致）
      MONITORING_USER: ${MONITORING_USER}
      MONITORING_PASSWORD: ${MONITORING_PASSWORD}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - app-net

  grafana:
    # pin 版本（grafana-oss 12.4 后停止更新，官方镜像改名 grafana/grafana）
    image: grafana/grafana:13.1.0
    container_name: pg-grafana
    restart: always
    ports:
      # 仅绑定 localhost，cloudflared 通过 localhost 连接
      - "127.0.0.1:3000:3000"
    environment:
      # 管理密码来自 .env（模板见 .env.example），显式关闭匿名登录
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # 2C4G 下全量模式首启过重（4 个重型内置 app 注册 apiserver + 后台安装器去 grafana.com 查插件，
      # 服务器连不上 grafana.com 时每个都等超时，实测首启 10+ 分钟），lightweight 模式禁用它们
      GF_DEFAULT_APP_MODE: lightweight
    volumes:
      # datasource/dashboard/alert 由 provisioning 文件驱动（与 compose 同目录，只读挂载）
      - ./prometheus/grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s  # 2C4G 首启慢，5 分钟内不判失败，避免误报 unhealthy
    deploy:
      resources:
        limits:
          memory: 512M     # Grafana 13 内存需求高，256M 过紧会拖慢启动
    networks:
      - app-net

  app:
    build: ./backend
    container_name: photo-manager
    restart: always
    ports:
      # 仅绑定 localhost，cloudflared 通过 localhost 连接
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST:-mysql}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBIT_HOST: ${RABBIT_HOST:-rabbitmq}
      RABBIT_PORT: ${RABBIT_PORT:-5672}
      RABBIT_USER: ${RABBIT_USER:-admin}
      RABBIT_PASS: ${RABBIT_PASS:-}
      # /actuator/prometheus Basic Auth 凭据（ProdSecurityValidator 校验非空）
      MONITORING_USER: ${MONITORING_USER}
      MONITORING_PASSWORD: ${MONITORING_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://localhost:*,https://hape233.online,https://hape233.online:8443
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 768M
    volumes:
      - photo_uploads:/data/photo-uploads
      - photo_logs:/root/logs/photo-manager
    networks:
      - app-net

  # cloudflared 隧道：当前服务器（阿里云）连不上 Cloudflare 边缘（实测 login/api 端点均超时），
  # 启动即 crash 循环，故注释停用。换网络环境可达的服务器时解开注释即可复用
  # （凭证仍走 /etc/cloudflared/config.yml + /root/.cloudflared，host 网络直达 localhost:8080/3000）。
  # cloudflared:
  #   image: cloudflare/cloudflared:2026.6.1
  #   container_name: cloudflared
  #   restart: always
  #   # 镜像默认非 root，读不了 root 700 的凭证目录，故以 root 运行（与 systemd 时代一致）
  #   user: "0:0"
  #   # 必须 host 网络：config.yml ingress 指向宿主机 localhost:8080/3000
  #   network_mode: host
  #   volumes:
  #     # 复用服务器上已有的配置与凭证（systemd 时代遗留，只读挂载）
  #     - /etc/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
  #     - /root/.cloudflared:/root/.cloudflared:ro
  #   command: tunnel --config /etc/cloudflared/config.yml run

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  photo_uploads:
  photo_logs:

networks:
  app-net:
    driver: bridge
