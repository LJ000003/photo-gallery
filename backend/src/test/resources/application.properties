spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
photo.upload-dir=target/test-uploads

# 注意：测试 classpath 下本文件会遮蔽 src/main/resources/application.properties
# （同名文件只加载第一个），main 中无默认值的属性必须在此补齐，否则 @Value 解析失败。
auth.konami-sequence=up,up,down,down,left,right,left,right,B,A,B,A
