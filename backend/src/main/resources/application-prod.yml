spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/photodb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:admin}
    password: ${RABBIT_PASS:}
    listener:
      simple:
        retry:
          enabled: false  # 由 consumer 自行处理重试逻辑

photo:
  upload-dir: /data/photo-uploads
  processing:
    type: rabbitmq
  watermark:
    font: SansSerif
    font-size-ratio: 40
    color-alpha: 180

cors:
  allowed-origins: http://localhost:*,https://hape233.online

# 生产环境关闭 API 文档
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 暴露 health（Docker healthcheck）+ prometheus（监控）
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
