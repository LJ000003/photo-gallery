spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/photodb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:admin}
    password: ${RABBIT_PASS:}
    listener:
      simple:
        retry:
          enabled: false  # 由 consumer 自行处理重试逻辑

photo:
  upload-dir: /data/photo-uploads
  processing:
    type: rabbitmq
  watermark:
    font: SansSerif
    font-size-ratio: 40
    color-alpha: 180

cors:
  # :8443 为备案过渡期非标端口（阿里云对未备案域名拦截 80/443），备案通过后可移除
  allowed-origins: http://localhost:*,https://hape233.online,https://hape233.online:8443

# 限流/封禁的客户端 IP 来源：仅信任 nginx 覆写的 X-Real-IP
# （app 只绑 127.0.0.1，客户端无法伪造）；换 cloudflared 隧道时改回 Cf-Connecting-Ip，留空则不信任任何头
security:
  trusted-proxy-header: X-Real-IP

# 生产环境关闭 API 文档
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 暴露 health（Docker healthcheck）+ prometheus（监控）
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

# /actuator/prometheus 的 Basic Auth 凭据（SecurityConfig 条件加载 MONITOR 用户；
# 漏配时 ProdSecurityValidator 启动即失败，杜绝静默裸奔）
monitoring:
  username: ${MONITORING_USER:}
  password: ${MONITORING_PASSWORD:}
