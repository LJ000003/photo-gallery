spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/photodb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

photo:
  upload-dir: /data/photo-uploads
  watermark:
    font: SansSerif
    font-size-ratio: 40
    color-alpha: 180

cors:
  allowed-origins: http://localhost:*,https://hape233.online

# 生产环境关闭 API 文档
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 仅暴露 health 端点
management:
  endpoints:
    web:
      exposure:
        include: health
