server.port=8080

# 安全链只在 REQUEST/ERROR 分发执行，跳过 ASYNC 分发：
# StreamingResponseBody 写出完成后容器会 async dispatch 重跑 filter chain，
# 此时 JwtAuthFilter 等 OncePerRequestFilter 因 alreadyFiltered 标记被跳过，
# 而 AuthorizationFilter 会重新执行——SecurityContextHolder 为空 → 匿名 → AccessDenied，
# 且响应已提交无法改写错误页（"response is already committed"）。
# 排除 ASYNC 后，async 阶段不重跑安全链（已鉴权请求的延续，无需重复鉴权）。
spring.security.filter.dispatcher-types=REQUEST,ERROR

# MySQL 驱动（公共）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 平台（公共）
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 文件上传限制（容器宽松接收，实际校验在应用层）
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# 照片存储目录
photo.upload-dir=${user.home}/photo-uploads
# 备份缓存目录：定时任务预生成的全量 zip 存这里；导出时数据指纹未变则直接下载（避免实时打包等待）
photo.backup-dir=${user.home}/photo-backups
# 备份预生成 cron（每天 3:05，避开 3:00 回收站清理高峰；导出接口本身也会在数据变化时刷新缓存）
backup.auto-cron=0 5 3 * * ?

# 水印配置
photo.watermark.font=SansSerif
photo.watermark.font-size-ratio=30
photo.watermark.color-alpha=180


spring.profiles.active=dev

# Spring Cache — 默认 Caffeine（dev/test），prod profile 覆盖为 Redis
spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=30s

# 图片处理 — 默认 @Async 线程池（dev/test），prod profile 覆盖为 rabbitmq
photo.processing.type=async

# Konami 解锁序列（后端验证，前端不存）
auth.konami-sequence=up,up,down,down,left,right,left,right,B,A,B,A