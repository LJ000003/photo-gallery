spring:
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/photodb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# dev 不跑 RabbitMQ/Redis，禁用其健康检查，避免 /actuator/health 误报 DOWN
# （starter 自动配置会无条件注册 ConnectionFactory + 健康指示器，连 localhost 5672/6379 失败）
management:
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false

cors:
  allowed-origins: http://localhost:*,https://hape233.online
