name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - run: mvn test --batch-mode
      - run: mvn spotbugs:check --batch-mode
      - run: mvn package -DskipTests --batch-mode

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit
      - run: npm test
      - run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 构建产物不入库：先构建前端（自动复制到 backend static），再打包 JAR
      - name: Build frontend
        run: cd frontend && npm install --no-audit && npm run build
      - run: cd backend && mvn package -DskipTests --batch-mode
      - run: docker build -t photo-gallery ./backend

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 构建产物不入库：先构建前端（自动复制到 backend static），再打包 JAR
      - name: Build frontend
        run: cd frontend && npm install --no-audit && npm run build

      - name: Build backend JAR
        run: cd backend && mvn package -DskipTests --batch-mode

      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Start backend (H2)
        env:
          JWT_SECRET: test-jwt-secret-key-for-unit-tests-minimum-256-bits
        run: |
          cd backend
          java -jar target/*.jar \
            --spring.datasource.url=jdbc:h2:mem:photodb \
            --spring.datasource.driver-class-name=org.h2.Driver \
            --spring.jpa.database-platform=org.hibernate.dialect.H2Dialect \
            --spring.jpa.hibernate.ddl-auto=create-drop \
            --spring.flyway.enabled=false \
            --management.health.rabbit.enabled=false \
            --management.health.redis.enabled=false \
            --spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration \
            --photo.upload-dir=/tmp/photo-uploads-e2e \
            --server.port=8080 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/actuator/health 2>/dev/null | grep -q UP; then
              echo "Backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: Run E2E tests
        run: cd frontend && npm run test:e2e

      - name: Stop backend
        if: always()
        run: pkill -f 'photo-gallery' || true
