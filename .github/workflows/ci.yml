name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend Tests, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit
      # test:coverage 让 vitest.config.ts 的 thresholds 生效（此前 vitest run 不带 --coverage，门槛从未触发）
      - run: npm run test:coverage
      # lint 入 CI——ESLint 不再只靠 pre-commit 钩子（--no-verify 可绕过）
      - run: npm run lint
      - run: npm run build
      # dist 产物供 backend job 打含前端静态资源的最终 JAR
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  backend:
    name: Backend Tests & Build (final JAR)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 复用 frontend job 的 dist 产物（copy-dist 在 mvn test 前执行无碍，static 含 dist 不影响测试）
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      # backend job 默认 working-directory=backend，脚本需用 ../ 回到仓库根
      - run: node ../frontend/scripts/copy-dist.mjs
      - run: mvn test --batch-mode
      - run: mvn spotbugs:check --batch-mode
      - run: mvn package -DskipTests --batch-mode
      # 含前端静态资源的最终 JAR，供 docker/e2e job 直接使用
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 3

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      # JAR 由 backend job 产出，本 job 不再需要 setup-java/setup-node 与任何构建
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target
      - run: docker build -t photo-gallery ./backend

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # JAR 由 backend job 产出（e2e 前端走 Vite dev server，JAR 不需要内嵌前端资源）
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target
      - name: Install Playwright Chromium
        run: cd frontend && npm install --no-audit && npx playwright install chromium --with-deps

      - name: Start backend (H2)
        env:
          JWT_SECRET: test-jwt-secret-key-for-unit-tests-minimum-256-bits
        run: |
          cd backend
          java -jar target/*.jar \
            --spring.datasource.url=jdbc:h2:mem:photodb \
            --spring.datasource.driver-class-name=org.h2.Driver \
            --spring.jpa.database-platform=org.hibernate.dialect.H2Dialect \
            --spring.jpa.hibernate.ddl-auto=create-drop \
            --spring.flyway.enabled=false \
            --management.health.rabbit.enabled=false \
            --management.health.redis.enabled=false \
            --spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration \
            --photo.upload-dir=/tmp/photo-uploads-e2e \
            --server.port=8080 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/actuator/health 2>/dev/null | grep -q UP; then
              echo "Backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: Run E2E tests
        run: cd frontend && npm run test:e2e

      - name: Stop backend
        if: always()
        run: pkill -f 'photo-gallery' || true
