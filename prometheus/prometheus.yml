global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'photo-gallery'
    metrics_path: '/actuator/prometheus'
    # 端点已加 Basic Auth（MONITOR 角色）。
    # 凭据经 compose secrets 以文件挂载（/run/secrets/，值来自 .env 的 MONITORING_*）；
    # 勿用 ${VAR} 内联——Prometheus 不做配置内环境变量展开，会按字面量发送导致恒 401
    basic_auth:
      username_file: /run/secrets/monitoring_user
      password_file: /run/secrets/monitoring_password
    static_configs:
      - targets: ['app:8080']

  # RabbitMQ 自带 Prometheus 插件（3.8+ 默认启用，15692 已监听）。
  # 不映射宿主机端口——同 docker 网络直抓，避免多一个无认证的指标端口。
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
